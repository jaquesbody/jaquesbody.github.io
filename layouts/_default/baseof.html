<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | jaquesbody{{ else }}jaquesbody: portfolio{{ end }}</title>
  <link rel="icon" type="image/svg+xml" href="/icons/logo-j1.svg">
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}I build tools for everyday life.{{ end }}">
  <style>
    /* Project accent — jaquesbody portfolio identity */
    :root {
      --accent:       #0EDA29;
      --accent-hover: #0BBF23;
      --accent-muted: rgba(14, 218, 41, 0.12);
    }
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/portfolio.css">
</head>
<body>
  <header class="site-header">
    <div class="container flex items-center justify-between">
      <a href="/" class="site-logo" aria-label="jaquesbody home">
        <img src="/icons/wordmark-js.svg" alt="jaquesbody" class="logo-wordmark">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <ul class="flex gap-3">
          <li><a href="/#projects">Projects</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
